name: Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prebuild the MCP wrapper on the host
        working-directory: mcp-wrapper
        run: |
          npm ci --prefer-offline
          npm run build

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: "cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux_* *_i686 *_ppc64le *_s390x *-win32 *-win_arm64"
          # Intel macOS is not a viable wheel target: numba, llvmlite and
          # cryptography no longer publish x86_64 macOS wheels, so the test
          # install falls back to source builds that cannot succeed.
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_BEFORE_ALL_MACOS: rustup target add aarch64-apple-darwin
          # glibc 2.17 (manylinux2014) predates the wheels our dependencies
          # publish — scipy/numba/cryptography ship manylinux_2_28 and newer
          # only, and building them from sdist in the test venv is what fails.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          # The manylinux build container has no Rust toolchain; install it
          # (pinned to the repo's rust-toolchain.toml channel) plus pkg-config,
          # which onig_sys probes for.
          CIBW_BEFORE_ALL_LINUX: >
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
            | sh -s -- -y --default-toolchain 1.87 --profile minimal &&
            (yum install -y pkgconfig ||
             apt-get update && apt-get install -y pkg-config || true)
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=11.0
          # A freshly built native wheel must import before it ships.
          CIBW_TEST_COMMAND: 'python -c "import iai_mcp, iai_mcp_native"'

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
