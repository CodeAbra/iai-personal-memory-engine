name: Extended checks

# Non-blocking checks that track work in progress without gating every push:
#   - Linux build/test (the native engine is code-complete on Linux but not yet
#     validated end-to-end)
#   - the Rust workspace gate (fmt / clippy / test / supply-chain policy)
#   - the lint backlog
# Runs weekly and on demand, so day-to-day pushes stay quiet.

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: build & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Correctness gate
        run: pytest -m "not perf and not slow and not live"

  rust:
    name: rust workspace (fmt / clippy / test / deny)
    runs-on: ubuntu-latest
    # The workspace carries ~482 tests across 8 crates that nothing ran until
    # now, so this lane starts non-blocking. Two known reds, both pre-existing
    # and neither a reason to hold up the tests actually running:
    #   * `cargo fmt --all --check` — the workspace has never been rustfmt
    #     enforced. Mechanical, but far too large to fold into the PR that
    #     introduces the gate; its own cleanup, like the ruff backlog above.
    #     Read the step's own output for the current scale rather than trusting
    #     a number here: this lane is the first thing to run rustfmt at all, and
    #     a pre-CI local estimate did not match what CI reported.
    #   * lilli-hd FHRR golden-parity `bundle` — fails on x86-64 (the blocking
    #     gate runs on ARM macOS). Measured, not guessed: on x86-64 the Python
    #     reference in src/iai_mcp/lilli/tiers/fhrr.py misses its OWN golden in
    #     328/10000 components while the Rust kernel misses 164, so the kernel
    #     is not the outlier. ~95% of the diffs are components whose
    #     pre-truncation value sits within 1e-6 of an integer boundary (byte
    #     inputs make angles exact multiples of TAU/256, so their means land on
    #     quantisation knife-edges); the rest are components whose resultant
    #     magnitude is ~1e-16, i.e. antipodal phasors where atan2 is undefined.
    #     The golden therefore encodes one machine's libm rounding. Left as-is
    #     deliberately: golden_parity.rs forbids regenerating a golden to make
    #     a test pass, and relaxing byte-exact parity is a maintainer call.
    # Promote to the blocking ci.yml gate once both are resolved.
    # RUSTUP_TOOLCHAIN is set per cargo step below rather than job-wide. Job-wide
    # it also entered the cargo-deny container, which then failed to resolve
    # `1.87-x86_64-unknown-linux-musl`.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      # Every check below carries `if: always()` so one red does not mask the
      # rest. Without it a failing `cargo fmt` would skip the tests entirely,
      # which is the opposite of what this lane is for. The job still reports
      # failure if any step fails.
      # RUSTUP_TOOLCHAIN must name the toolchain dtolnay/rust-toolchain actually
      # installed — "1.87.0", not "1.87". Pinned to "1.87" rustup resolves a
      # different, component-less toolchain and cargo-fmt/cargo-clippy are "not
      # installed"; unset, rustup reads rust-toolchain.toml (channel "1.87") and
      # minimal-installs it without those components, which fails the same way.
      - name: Formatting
        env:
          RUSTUP_TOOLCHAIN: "1.87.0"
        run: cargo fmt --all --check
      - name: Clippy
        # Deliberately not -D warnings yet: a local run reports ~165 warnings
        # across the workspace. Note this step goes red anyway, and not because
        # of those: clippy::approx_constant is deny-by-default and fires on
        # crates/lillibrain/src/codec.rs:498 (`Value::Float(3.141592653589793)`
        # — PI written out longhand). One error, one line, left for a maintainer
        # rather than folded into a CI change.
        if: always()
        env:
          RUSTUP_TOOLCHAIN: "1.87.0"
        run: cargo clippy --workspace --all-targets
      - name: Tests
        # --no-fail-fast: without it cargo stops at the first failing crate, and
        # the first run reported only ~78 of ~482 tests before aborting on
        # lilli-hd. A discovery lane needs the whole picture.
        if: always()
        env:
          RUSTUP_TOOLCHAIN: "1.87.0"
        run: cargo test --workspace --no-fail-fast
      - name: Supply-chain policy
        # deny.toml has encoded the licence allow-list and the GPL/AGPL/LGPL ban
        # since it was written; this is the first thing to actually run it.
        if: always()
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install "ruff>=0.5"
      - run: ruff check .
