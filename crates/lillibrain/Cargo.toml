[package]
name = "lillibrain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.87"

[lib]
crate-type = ["rlib"]

[dependencies]
crc32fast = "1.5.0"
fs4 = "1.1.0"
bytemuck = "1.25.0"
parking_lot = "0.12.5"
thiserror = { workspace = true }
pyo3 = { workspace = true }
pyo3-stub-gen = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
proptest = "1.11.0"
criterion = "0.8.2"

[[bench]]
name = "insert"
harness = false
